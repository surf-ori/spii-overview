<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPII Overview</title>
<meta name="description" content="An overview of the six deliverables of SPII, the Strategic Plan for Integrated Open Science Infrastructure.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --bg:#f6f4ec;
    --surface:#ffffff;
    --surface-2:#eeebdf;
    --text:#161f18;
    --text-muted:#4d5850;
    --accent:#1f5c43;
    --accent-strong:#153f2e;
    --accent-soft:#dfe9df;
    --on-accent:#fbfdfb;
    --border:#d9d4c3;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#10140f;
      --surface:#161c15;
      --surface-2:#1c231b;
      --text:#eae7db;
      --text-muted:#9fad9f;
      --accent:#59b98a;
      --accent-strong:#7fd1a6;
      --accent-soft:#1e2c22;
      --on-accent:#10140f;
      --border:#2b342a;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Outfit", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1100px;
    margin:0 auto;
    padding-inline:20px;
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }
</style>
</head>
